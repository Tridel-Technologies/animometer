<div class="flex-1 flex gap-5 min-h-0">
    <!-- Threshold Configuration -->
    <div
        class="flex-1 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 shadow-sm flex flex-col gap-8">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-sliders text-blue-600 text-2xl"></i>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Parameter Thresholds</h2>
        </div>
        <div class="grid grid-cols-2 gap-6">
            <div *ngFor="let t of thresholds"
                class="p-6 rounded-xl bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-800">
                <label class="text-sm font-black text-slate-400 uppercase tracking-widest block mb-3">{{
                    t.label }}</label>
                <div class="flex items-center gap-4">
                    <input type="number" [value]="t.value"
                        class="flex-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3 rounded-lg font-bold text-base outline-none focus:ring-2 focus:ring-blue-500">
                    <span class="text-base font-bold text-slate-500">{{ t.unit }}</span>
                </div>
            </div>
        </div>
        <button
            class="mt-auto px-8 py-4 rounded-xl bg-blue-600 text-white font-black uppercase tracking-widest text-sm hover:bg-blue-700 transition-all">
            Save Configuration
        </button>
    </div>

    <!-- Station Settings -->
    <div
        class="w-1/3 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 shadow-sm flex flex-col gap-8">
        <div class="flex items-center gap-4">
            <i class="fa-solid fa-satellite-dish text-blue-600 text-2xl"></i>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white">Station Settings</h2>
        </div>
        <div class="flex flex-col gap-6">
            <div class="flex flex-col gap-2">
                <label class="text-sm font-black text-slate-400 uppercase tracking-widest">Selected
                    Station</label>
                <select
                    class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-4 rounded-xl font-bold text-base outline-none">
                    <option>Main Mast 01</option>
                    <option>Front Bridge 02</option>
                </select>
            </div>
            <div class="flex flex-col gap-2">
                <label class="text-sm font-black text-slate-400 uppercase tracking-widest">Sync
                    Interval</label>
                <select
                    class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-4 rounded-xl font-bold text-base outline-none">
                    <option>Every 5 Seconds</option>
                    <option>Every 30 Seconds</option>
                    <option>Every 1 Minute</option>
                </select>
            </div>
        </div>
    </div>
</div>
