<div
    class="h-screen w-full overflow-hidden flex relative bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">

    <!-- Sidebar -->
    <div class="transition-all duration-300 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col shadow-sm z-10"
        [ngClass]="expandedSideBar ? 'w-56' : 'w-16'">

        <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
            <span *ngIf="expandedSideBar"
                class="font-bold text-lg text-blue-600 dark:text-blue-400 uppercase tracking-wider">
                Marine HQ
            </span>
            <button (click)="onChangeExpandSideBar()"
                class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400 transition-colors">
                <i class="fa-solid" [ngClass]="expandedSideBar ? 'fa-chevron-left' : 'fa-chevron-right'"></i>
            </button>
        </div>

        <nav class="flex-1 p-3 space-y-2 overflow-y-auto">
            <button *ngFor="let item of navItems" (click)="setActiveTab(item.id)"
                class="w-full flex items-center gap-3 p-2.5 rounded-xl transition-all duration-200 text-sm"
                [ngClass]="activeTab === item.id
                ? 'bg-blue-600 text-white shadow-md'
                : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-blue-600 dark:hover:text-blue-400'">
                <i class="fa-solid text-base flex-shrink-0" [ngClass]="item.icon"></i>
                <span *ngIf="expandedSideBar" class="font-medium truncate">{{ item.label }}</span>
            </button>
        </nav>

        <div class="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center gap-3 justify-center">
            <div class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.5)]"></div>
            <span *ngIf="expandedSideBar" class="text-xs font-semibold text-green-600 dark:text-green-500">Live
                Status</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1  flex flex-col min-h-0">

        <!-- Top Header -->
        <div
            class="bg-white w-[calc(100%-4rem)] dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-6 py-4 pr-35 flex items-center justify-between shadow-sm z-10">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-xl font-bold text-slate-900 dark:text-white">
                        Marine Navigation Console
                    </h1>
                    <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-tighter">
                        Real-time Monitoring • {{ formatDateTime() }} UTC</p>
                </div>
            </div>

            <div class="flex items-center gap-6">
                <div class="text-right hidden sm:block">
                    <div class="font-mono text-blue-600 dark:text-blue-400 font-bold text-lg leading-none">{{
                        formatDateTime() }} UTC</div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mt-1">Vessel: <span
                            class="font-bold text-slate-900 dark:text-white">MV AURORA</span></div>
                </div>

                <!-- Theme Toggle -->
                <button (click)="toggleTheme()"
                    class="w-10 h-10 rounded-full flex items-center justify-center bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:scale-105 transition-transform shadow-inner">
                    <i class="fa-solid" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
                </button>
            </div>
        </div>


        <!-- Main Content Area -->
        <div class="flex-1 p-4 flex flex-col gap-4 min-h-0 overflow-hidden">

            <!-- Home Dashboard / Anemometer -->
            <app-dashboard *ngIf="activeTab === 'home'" [anemometerData]="anemometerData"
                [selectedStation]="selectedStation" [widgetData]="widgetData"></app-dashboard>


            <!-- Report Page -->
            <app-report *ngIf="activeTab === 'report'" [reportData]="reportData"
                [reportColumns]="reportColumns"></app-report>

            <!-- Analysis Page -->
            <app-analysis *ngIf="activeTab === 'analysis'" [reportData]="reportData"
                [anemometerData]="anemometerData"></app-analysis>

            <!-- Settings Page -->
            <app-settings *ngIf="activeTab === 'settings'" [thresholds]="thresholds"></app-settings>

            <!-- Profile Page -->
            <app-profile *ngIf="activeTab === 'profile'" [currentUser]="currentUser"></app-profile>

        </div>
    </div>
</div>
